# Serve o build estático do React (SPA) em produção — ver infra/docker/web.Dockerfile
# (stage "production") e docker-compose.prod.yml.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Roteamento client-side (react-router): qualquer caminho sem arquivo correspondente
    # cai de volta em index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets versionados pelo Vite (hash no nome do arquivo) podem ser cacheados
    # agressivamente sem risco de servir conteúdo desatualizado.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }
}

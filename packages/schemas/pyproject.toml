[project]
name = "dhf-schemas"
version = "0.1.0"
description = "Digital Human Factory — contratos Pydantic compartilhados entre serviços"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dhf_schemas"]

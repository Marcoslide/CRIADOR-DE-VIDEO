# Base — ambiente-agnóstica, sem porta de banco/cache publicada e sem senha padrão
# insegura. Sozinha, `docker compose -f docker-compose.yml ...` falha alto (${VAR:?...})
# se as credenciais não forem definidas — de propósito, para nunca subir em produção com
# um valor padrão fraco.
#
#   Dev:  `docker compose up --build`
#         (carrega docker-compose.override.yml automaticamente — portas locais,
#         credenciais de desenvolvimento, servidor Vite)
#   Prod: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build`
#         (sem override — Postgres/Redis nunca publicados, build estático + nginx)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD — nunca use um valor padrão em produção}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile

volumes:
  postgres_data:

[project]
name = "digital-human-factory"
version = "0.1.0"
description = "Digital Human Video Factory — monorepo raiz (workspace uv)"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/shared",
    "packages/schemas",
    "workers/job_worker",
    "services/storage",
    "core/avatars",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ tem pseudo-código ilustrativo (Pydantic/Protocol) em blocos ```python — não é
# código real do projeto, então não deve ser reformatado como se fosse.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: testes reais contra serviços externos (skip automático sem credencial)",
    "requires_services: precisa de Postgres/Redis/worker reais rodando (não é unitário)",
    "requires_worker_offline: precisa de Redis real rodando e worker deliberadamente parado",
]

[project]
name = "dhf-avatars"
version = "0.1.0"
description = "Digital Human Factory — Avatar Registry (fundação da Fase 3: CRUD + máquina de estados)"
requires-python = ">=3.11"
dependencies = [
    "dhf-shared",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
]

[tool.uv.sources]
dhf-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dhf_avatars"]

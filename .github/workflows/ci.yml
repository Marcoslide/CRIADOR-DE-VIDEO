name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-unit:
    name: Backend · testes unitários (sem serviços externos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.9"

      - name: uv sync
        run: uv sync --all-packages --frozen

      - name: pytest (unitário — sem Postgres/Redis/credencial real)
        run: uv run pytest -m "not requires_services and not requires_worker_offline" -v

  backend-integration:
    name: Backend · testes de integração (Postgres + Redis reais)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dhf
          POSTGRES_PASSWORD: dhf
          POSTGRES_DB: dhf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhf -d dhf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      LOG_LEVEL: INFO
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: dhf
      POSTGRES_PASSWORD: dhf
      POSTGRES_DB: dhf
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.9"

      - name: uv sync
        run: uv sync --all-packages --frozen

      - name: Alembic — upgrade, rollback completo e novo upgrade
        run: |
          uv run alembic -c migrations/alembic.ini upgrade head
          uv run alembic -c migrations/alembic.ini downgrade base
          uv run alembic -c migrations/alembic.ini upgrade head

      - name: Subir worker Celery em background
        run: |
          nohup uv run --directory workers/job_worker celery -A worker.celery_app worker \
            --loglevel=INFO > celery.log 2>&1 &
          echo $! > celery.pid
          sleep 5

      - name: pytest (integração — Postgres/Redis/worker reais)
        run: uv run pytest -m requires_services -v

      - name: Parar worker e provar detecção offline real
        run: |
          kill "$(cat celery.pid)"
          for i in {1..20}; do
            if ! kill -0 "$(cat celery.pid)" 2>/dev/null; then break; fi
            sleep 0.25
          done
          uv run pytest -m requires_worker_offline -v

      - name: Logs do worker (se algo falhar)
        if: failure()
        run: cat celery.log || true

  lint:
    name: Backend · ruff check + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.9"

      - name: uv sync
        run: uv sync --all-packages --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker-build:
    name: Docker · build das imagens reais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f infra/docker/api.Dockerfile -t dhf-api:test .
      - run: docker build -f infra/docker/worker.Dockerfile -t dhf-worker:test .
      - run: >-
          docker build -f infra/docker/web.Dockerfile --target production
          --build-arg VITE_API_URL=http://localhost:8000 -t dhf-web:test .

  secrets-scan:
    name: Verificação de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          set -euo pipefail
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: gitleaks detect
        run: gitleaks detect --source . --redact --verbose
